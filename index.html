<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp Form Validation</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- Css link -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <center>
      <div class="container m-4">
        <form
          class="row g-3 needs-validation mt-5 rounded-5 p-5 bg-info text-light novalidate"
        >
          <h1 class="text-center">Sign Up</h1>
          <div class="col-12">
            <label for="fullName" class="form-label">FullName</label>
            <input type="text" class="form-control" id="fullName" required />
            <div class="invalid-feedback">Please enter your full name.</div>
          </div>
          <div class="col-12">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" required />
            <div class="invalid-feedback">Please provide a valid email.</div>
          </div>
          <div class="col-md-6">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              required
              pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
            />
            <div class="invalid-feedback">
              Password must be 8+ characters, with uppercase, lowercase, and a
              number..
            </div>
          </div>
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <input
              type="password"
              class="form-control"
              id="confirmPassword"
              required
              minlength="8"
            />
            <div class="invalid-feedback">Password do not match.</div>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input
                type="checkbox"
                class="form-check-input"
                id="terms"
                required
              />
              <label for="terms" class="form-check-label"
                >Agree to terms and conditions</label
              >
              <div class="invalid-feedback">
                You must agree before submitting.
              </div>
            </div>
          </div>
          <div class="col-12">
            <button
              class="btn btn-primary bg-light text-dark w-100 form-contol"
              type="submit"
            >
              Sign Up
            </button>
          </div>
          <div class="classList"></div>
        </form>
      </div>
    </center>
    <script src="validation.js"></script>
  </body>
</html>
